name: Scan

on:
  schedule:
    - cron: "0 * * * *"   # saatlik
  workflow_dispatch:
    inputs:
      test:
        description: "Test maili (gevşek filtre, seen.json'a yazmaz)"
        type: boolean
        default: false
  repository_dispatch:
    types: [scan]

permissions:
  contents: read

# İki koşu aynı anda aynı durumu okuyup aynı işlemleri iki kez mail atmasın.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # seen.json repoya commit'lenmez (yerel push çakışması olmasın diye), Actions önbelleğinde durur.
      # Önbellek boşsa repodaki seen.json başlangıç değeri olarak kullanılır.
      - uses: actions/cache/restore@v6
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scanner.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TEST_MAIL: ${{ inputs.test }}

      - if: ${{ inputs.test != true }}
        uses: actions/cache/save@v6
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
