name: Scan

on:
  schedule:
    - cron: "0 * * * *"   # saatlik
  workflow_dispatch:
    inputs:
      test:
        description: "Test maili (gevşek filtre, seen.json'a yazmaz)"
        type: boolean
        default: false
  repository_dispatch:
    types: [scan]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scanner.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TEST_MAIL: ${{ inputs.test }}

      - name: seen.json güncellemesini commitle
        run: |
          git config user.name "fomo_scanner bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "dedupe: seen.json güncelle"
          git push
