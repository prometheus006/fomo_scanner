name: Scan

on:
  schedule:
    - cron: "0 * * * *"   # saatlik
  workflow_dispatch: {}
  repository_dispatch:
    types: [scan]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scanner.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: seen.json güncellemesini commitle
        run: |
          git config user.name "fomo_scanner bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "dedupe: seen.json güncelle"
          git push
